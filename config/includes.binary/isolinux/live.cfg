label live-amd64
	menu label ^Dizdar Linux'u Baslat (Canli Mod)
	menu default
	kernel /live/vmlinuz
	append initrd=/live/initrd.img boot=live components quiet splash locales=tr_TR.UTF-8 keyboard-layouts=tr username=dizdar user-password=dizdar hostname=dizdar-linux plymouth.ignore-serial-consoles

label live-amd64-failsafe
	menu label Dizdar Linux (^Guvenli Mod - Failsafe)
	kernel /live/vmlinuz
	append initrd=/live/initrd.img boot=live components quiet splash locales=tr_TR.UTF-8 keyboard-layouts=tr username=dizdar user-password=dizdar hostname=dizdar-linux plymouth.ignore-serial-consoles memtest noapic noapm nodma nomce nolapic nomodeset nosmp nosplash vga=normal
